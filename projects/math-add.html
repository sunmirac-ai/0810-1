<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>분필 덧셈 놀이터 — 초등 수학</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css"></script>
<style>
  :root{
    --bg:#FFF7EC; --card:#ffffff; --ink:#3D3226; --muted:#8A7B67;
    --a1:#FF8B6B; --a2:#6BC7FF; --a3:#FFD166; --a4:#8CE6A1;
    --font-display:'Jua','Gaegu',sans-serif; --font-body:'PretendardVariable',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    --radius:24px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background: var(--bg); color:var(--ink); font-family:var(--font-body);
    min-height:100vh;
    background-image: radial-gradient(circle at 10% 15%, rgba(255,139,107,0.14), transparent 40%),
                       radial-gradient(circle at 90% 80%, rgba(107,199,255,0.16), transparent 45%);
  }
  .wrap{ max-width:520px; margin:0 auto; padding: 20px 18px 60px; }
  @media(min-width:900px){ .wrap{ max-width:640px; padding-top: 40px; } }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; }
  .back{
    font-family:var(--font-mono); font-size:12.5px; color:var(--muted); text-decoration:none;
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:999px; background:var(--card);
    box-shadow: 0 2px 0 rgba(61,50,38,0.08);
  }
  .badge{ font-family:var(--font-mono); font-size:11px; background:var(--a3); color:#4A3B10; padding:6px 12px; border-radius:999px; font-weight:700; }

  h1{ font-family:var(--font-display); font-size: clamp(30px,7vw,42px); margin: 10px 0 6px; }
  .sub{ color:var(--muted); font-size:14px; margin-bottom: 26px; }

  .stage{
    background: var(--card); border-radius: var(--radius); padding: 30px 22px;
    box-shadow: 0 10px 0 rgba(61,50,38,0.06), 0 2px 10px rgba(61,50,38,0.05);
    text-align:center;
  }
  .level-tag{
    display:inline-block; font-family:var(--font-mono); font-size:12px; padding:6px 14px;
    border-radius:999px; background:#F2ECDF; color:var(--muted); margin-bottom: 22px;
  }
  .level-tag b{ color: var(--ink); }

  .question{
    font-family: var(--font-display); font-size: clamp(48px, 14vw, 72px); color:var(--ink);
    margin-bottom: 30px; user-select:none;
  }
  .options{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(min-width:520px){ .options{ grid-template-columns: repeat(4,1fr); } }
  .opt{
    font-family: var(--font-display); font-size: 26px;
    padding: 20px 10px; border-radius: 18px; border:none; cursor:pointer;
    background: #F5F0E4; color: var(--ink);
    transition: transform .12s ease, background .12s ease;
  }
  .opt:hover{ transform: translateY(-3px); background:#EFE7D4; }
  .opt:active{ transform: translateY(0); }
  .opt.correct{ background: var(--a4); color:#173D22; }
  .opt.wrong{ background: var(--a1); color:#4A1305; }

  .feedback{ margin-top: 22px; font-size:15px; min-height: 26px; font-weight:700; }
  .feedback.good{ color:#2E8B57; }
  .feedback.bad{ color:#D65B3C; }

  .stats{ display:flex; justify-content:center; gap: 26px; margin-top: 26px; }
  .stat{ text-align:center; }
  .stat .num{ font-family:var(--font-display); font-size:24px; }
  .stat .lab{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted); }

  .explain{
    margin-top: 30px; background:#F5F0E4; border-radius: 18px; padding: 18px 20px; text-align:left;
  }
  .explain h3{ margin:0 0 8px; font-size:14px; font-family:var(--font-mono); color:#7A5A2A; }
  .explain p{ margin:0; font-size:13px; color:var(--muted); line-height:1.6; }

  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.08);} 100%{transform:scale(1);} }
  .pop{ animation: pop .3s ease; }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="../portfolio.html">← 메인으로</a>
      <span class="badge">초등 1~2학년 · 수학</span>
    </div>

    <h1>분필 덧셈 놀이터 🍬</h1>
    <p class="sub">덧셈 문제를 풀어보세요. 잘 맞히면 문제가 조금 더 어려워지고, 틀리면 다시 쉬워져요.</p>

    <div class="stage">
      <div class="level-tag">지금 난이도: <b id="levelLabel">한 자리 수</b></div>
      <div class="question pop" id="question">?</div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="stats">
        <div class="stat"><div class="num" id="scoreNum">0</div><div class="lab">맞힌 개수</div></div>
        <div class="stat"><div class="num" id="streakNum">0</div><div class="lab">연속 정답</div></div>
      </div>
    </div>

    <div class="explain">
      <h3>✦ AI 활용 방식</h3>
      <p>정답을 3번 연속 맞히면 난이도가 올라가고(한 자리 → 두 자리 수), 2번 연속 틀리면 난이도가 다시 내려갑니다. 이렇게 학생의 실시간 정답 패턴을 분석해 문제 난이도를 자동으로 조절하는 것이 적응형 학습(Adaptive Learning) AI의 기본 원리입니다.</p>
    </div>
  </div>

<script>
  let level = 1;
  let correctStreak = 0, wrongStreak = 0, score = 0;
  let currentAnswer = null;
  let locked = false;

  const qEl = document.getElementById('question');
  const optEl = document.getElementById('options');
  const fbEl = document.getElementById('feedback');
  const levelLabel = document.getElementById('levelLabel');
  const scoreNum = document.getElementById('scoreNum');
  const streakNum = document.getElementById('streakNum');

  function newQuestion(){
    locked = false;
    fbEl.textContent = '';
    fbEl.className = 'feedback';
    const max = level === 1 ? 9 : 50;
    const a = Math.floor(Math.random()*max)+1;
    const b = Math.floor(Math.random()*max)+1;
    currentAnswer = a + b;

    qEl.textContent = `${a} + ${b} = ?`;
    qEl.classList.remove('pop'); void qEl.offsetWidth; qEl.classList.add('pop');

    const options = new Set([currentAnswer]);
    while(options.size < 4){
      const fake = currentAnswer + (Math.floor(Math.random()*9)-4);
      if(fake > 0 && fake !== currentAnswer) options.add(fake);
    }
    const shuffled = [...options].sort(() => Math.random()-0.5);
    optEl.innerHTML = '';
    shuffled.forEach(val => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = val;
      btn.addEventListener('click', () => handleAnswer(btn, val));
      optEl.appendChild(btn);
    });
    levelLabel.textContent = level === 1 ? '한 자리 수' : '두 자리 수';
  }

  function handleAnswer(btn, val){
    if(locked) return;
    locked = true;
    if(val === currentAnswer){
      btn.classList.add('correct');
      fbEl.textContent = '정답이에요! 참 잘했어요 ⭐';
      fbEl.className = 'feedback good';
      score++; correctStreak++; wrongStreak = 0;
      if(correctStreak >= 3 && level === 1){ level = 2; correctStreak = 0; }
    } else {
      btn.classList.add('wrong');
      fbEl.textContent = `아쉬워요! 정답은 ${currentAnswer}이었어요`;
      fbEl.className = 'feedback bad';
      wrongStreak++; correctStreak = 0;
      if(wrongStreak >= 2 && level === 2){ level = 1; wrongStreak = 0; }
    }
    scoreNum.textContent = score;
    streakNum.textContent = correctStreak;
    setTimeout(newQuestion, 900);
  }

  newQuestion();
</script>
</body>
</html>
